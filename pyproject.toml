[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convex-quadratic-programming-solver"
version = "0.2.0"
description = "A research-oriented Python implementation of a primal-dual interior-point solver for convex quadratic programming."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Peyman Salimi", email = "pmnslm6344@gmail.com" },
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
]

[project.optional-dependencies]
bench = [
    "osqp>=1.0",
    "clarabel>=0.9",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "hypothesis>=6.100",
]

[project.scripts]
cqp-solve = "solver.cli:main"

[tool.setuptools]
packages = ["solver", "validation"]

[tool.setuptools.package-data]
solver = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# Roadmap-mandated exception names (InvalidProblem, NonConvexProblem, ...).
"solver/exceptions.py" = ["N818"]
# Test names embed math notation (P, A, G).
"tests/**" = ["N802", "N803"]

[tool.mypy]
exclude = ["^api/"]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "django.*", "rest_framework.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "qp_api.settings"
pythonpath = ["api"]
testpaths = ["tests"]
python_files = ["test_*.py"]
[tool.coverage.run]
source = ["solver"]
omit = ["solver/__init__.py"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

